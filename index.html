<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tania Rahman | Professional Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Poppins', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: '#ec4899',
                        secondary: '#8b5cf6',
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-gentle': 'bounceGentle 2s ease-in-out infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        bounceGentle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 5px; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        .light .glass-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(236, 72, 153, 0.15);
            box-shadow: 0 8px 32px 0 rgba(236, 72, 153, 0.05);
        }

        body {
            background-color: #fff0f5;
            color: #1e293b;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
        }
        .dark body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        .gradient-text {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #ec4899, #8b5cf6);
        }

        /* ===== HERO ANIMATION STYLES ===== */
        #hero-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .hero-video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(236, 72, 153, 0.08) 0%,
                rgba(139, 92, 246, 0.06) 50%,
                rgba(16, 185, 129, 0.04) 100%
            );
            z-index: 1;
        }

        .hero-scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.015) 2px,
                rgba(0,0,0,0.015) 4px
            );
            z-index: 1;
            pointer-events: none;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            animation: floatShape linear infinite;
            pointer-events: none;
        }

        @keyframes floatShape {
            0% { transform: translateY(110vh) rotate(0deg) scale(0.5); opacity: 0; }
            5% { opacity: 1; }
            95% { opacity: 1; }
            100% { transform: translateY(-20vh) rotate(720deg) scale(1.2); opacity: 0; }
        }

        .hero-grid-overlay {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(236,72,153,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(236,72,153,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
        }

        .glitch-text {
            position: relative;
        }
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: inherit;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glitch-text::before {
            animation: glitch1 8s infinite;
            clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
        }
        .glitch-text::after {
            animation: glitch2 8s infinite;
            clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
        }
        @keyframes glitch1 {
            0%, 90%, 100% { transform: translateX(0); opacity: 0; }
            92% { transform: translateX(-3px); opacity: 0.5; filter: hue-rotate(90deg); }
            94% { transform: translateX(3px); opacity: 0.5; }
            96% { transform: translateX(0); opacity: 0; }
        }
        @keyframes glitch2 {
            0%, 85%, 100% { transform: translateX(0); opacity: 0; }
            87% { transform: translateX(3px); opacity: 0.4; filter: hue-rotate(-90deg); }
            89% { transform: translateX(-3px); opacity: 0.4; }
            91% { transform: translateX(0); opacity: 0; }
        }

        .hero-stat-card {
            animation: statFloat 4s ease-in-out infinite;
        }
        @keyframes statFloat {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }

        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(236,72,153,0.15);
            animation: orbit linear infinite;
        }
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .orbit-dot {
            position: absolute;
            width: 8px; height: 8px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 50%;
            top: -4px; left: calc(50% - 4px);
            box-shadow: 0 0 10px rgba(236,72,153,0.6);
        }

        .typewriter-cursor {
            display: inline-block;
            width: 3px;
            height: 1.1em;
            background: #ec4899;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(236,72,153,0.08);
            border: 1px solid rgba(236,72,153,0.25);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: #ec4899;
            letter-spacing: 0.5px;
            animation: badgePulse 3s ease-in-out infinite;
        }
        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(236,72,153,0.2); }
            50% { box-shadow: 0 0 0 8px rgba(236,72,153,0); }
        }
        .badge-dot {
            width: 6px; height: 6px;
            background: #ec4899;
            border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.6; }
        }

        /* ===== PRINT / CV STYLES ===== */
        @media print {
            body * { visibility: hidden; }
            #cv-print-area, #cv-print-area * { visibility: visible; }
            #cv-print-area {
                position: absolute; left: 0; top: 0;
                width: 100%; margin: 0; padding: 0;
                background: white; color: black; z-index: 9999;
            }
            .no-print { display: none !important; }
            a { text-decoration: none; color: inherit; }
        }

        .cv-section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 3px;
            color: #ec4899; border-bottom: 2px solid #ec4899;
            padding-bottom: 4px; margin-bottom: 12px;
            display: inline-block;
        }
        .cv-entry-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 700; font-size: 14px; color: #1e293b;
        }
        .cv-entry-sub {
            font-family: 'Inter', sans-serif;
            font-size: 12px; color: #64748b; font-weight: 500;
        }
        .cv-entry-desc {
            font-family: 'Inter', sans-serif;
            font-size: 11px; color: #475569; line-height: 1.5;
        }
        .cv-skill-bar-bg {
            background: #e2e8f0; border-radius: 4px; height: 6px; width: 100%;
        }
        .cv-skill-bar-fill {
            background: linear-gradient(to right, #ec4899, #8b5cf6);
            border-radius: 4px; height: 100%;
        }

        .cv-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; align-items: flex-start; justify-content: center;
            padding: 20px; overflow-y: auto;
        }

        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 4px; }

        @keyframes typingDot {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }
        .typing-dot:nth-child(1) { animation: typingDot 1.4s infinite 0s; }
        .typing-dot:nth-child(2) { animation: typingDot 1.4s infinite 0.2s; }
        .typing-dot:nth-child(3) { animation: typingDot 1.4s infinite 0.4s; }

        @keyframes chatPulse {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
        .chat-pulse-ring { animation: chatPulse 2s infinite; }
    </style>
</head>

        const HeroCanvas = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;
                let particles = [];
                const resize = () => {
                    canvas.width = canvas.offsetWidth;
                    canvas.height = canvas.offsetHeight;
                };
                resize();
                window.addEventListener('resize', resize);

                class Particle {
                    constructor() { this.reset(); }
                    reset() {
                        this.x = Math.random() * canvas.width;
                        this.y = Math.random() * canvas.height;
                        this.size = Math.random() * 2.5 + 0.5;
                        this.speedX = (Math.random() - 0.5) * 0.6;
                        this.speedY = (Math.random() - 0.5) * 0.6;
                        this.opacity = Math.random() * 0.5 + 0.1;
                        this.color = Math.random() > 0.5 ? '#ec4899' : '#8b5cf6';
                        this.life = 0;
                        this.maxLife = Math.random() * 200 + 100;
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        this.life++;
                        if (this.life > this.maxLife || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
                    }
                    draw() {
                        ctx.save();
                        ctx.globalAlpha = this.opacity * (1 - this.life / this.maxLife);
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                for (let i = 0; i < 80; i++) particles.push(new Particle());

                const connectParticles = () => {
                    for (let a = 0; a < particles.length; a++) {
                        for (let b = a + 1; b < particles.length; b++) {
                            const dist = Math.hypot(particles[a].x - particles[b].x, particles[a].y - particles[b].y);
                            if (dist < 120) {
                                ctx.save();
                                ctx.globalAlpha = (1 - dist / 120) * 0.12;
                                ctx.strokeStyle = '#ec4899';

/* PROJECTS */
